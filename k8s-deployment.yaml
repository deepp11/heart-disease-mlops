apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      containers:
      - name: heart-api
        image: heart-api:latest  # ← MUST match your Docker image name
        imagePullPolicy: IfNotPresent  # ← Use local if exists
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api-service
spec:
  selector:
    app: heart-api
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30007  # For NodePort type
  type: NodePort  # ← Use NodePort for local access
